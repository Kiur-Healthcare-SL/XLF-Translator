schema: spec-driven

context: |
  Product: a Streamlit app for translating Angular XLIFF 1.2 (.xlf) message
  catalogs, one translation unit per screen.

  Flow: upload .xlf -> parse -> classify by content, never by file name
  (fresh / partial / completed) -> choose a target language for a fresh
  catalog, or adopt the one the document already declares -> translate one unit
  per screen, moving with Prev/Next or by ordinal, resuming at the first
  unresolved unit -> optionally copy the source into the target as a starting
  point -> Save draft at any time, or Download once every unit is translated.
  Both exports go through the browser save dialog, so the app never chooses a
  location on disk.

  Placeholder safety is the point of the product. Angular's inline <x/> elements
  are masked as {1}...{n} while a human edits, and unmasked losslessly on write,
  so the emitted XML is byte-equivalent for everything the translator did not
  change. A unit whose target placeholders do not match its source's is invalid:
  the app refuses to move off it and refuses to export the catalog. Clearing a
  target is always permitted, so no unit can trap the translator.

  Out of scope for now: machine translation, and signing or embedding a
  signature image.

  Tech stack: Python 3.11+, Streamlit (presentation only), the standard library
  xml.etree.ElementTree for XLIFF, pytest for tests.

  Architecture: strict Clean Architecture in four layers.
    - domain/         Business entities and value objects only. No I/O, no
                      framework imports, no Streamlit, no XML libraries.
    - application/    Use cases orchestrating domain objects. Depends on domain
                      and on ports (abstract interfaces) it declares itself.
    - infrastructure/ Implementation details: XLIFF parsing and serialisation.
                      Implements application ports. Exports leave through the
                      browser, so nothing here writes to the filesystem.
    - presentation/   Streamlit screens, widgets and session-state adapters.
                      Holds no business logic; it only calls use cases and
                      renders their results. Business rules must be testable
                      with no Streamlit.
  Dependencies point inwards only: presentation -> application -> domain.
  infrastructure depends on application ports, never the reverse.

  Code style: Object Calisthenics.
    1. One level of indentation per method.
    2. No else keyword.
    3. Wrap all primitives and strings in value objects (LanguageCode,
       UnitIdentifier, SourceContent, TargetContent, CatalogPosition...).
    4. First-class collections (a class holding a collection holds no other field).
    5. One dot per line.
    6. No abbreviations in names.
    7. Keep entities small.
    8. No class with more than two instance variables.
    9. No getters/setters/public properties; tell, don't ask.
  Hard limits: functions under 20 lines, classes under 200 lines.
  One class per file, named after the class, with its own dedicated unit test
  file mirroring the package path.

  Agents must not perform git write operations; see AGENTS.md. This is enforced
  by a hook and a plugin, not only by convention.

rules:
  proposal:
    - Keep proposals under 500 words
  design:
    - State which layer each new concept belongs to (domain, application, infrastructure, presentation)
    - Name the ports and their implementations explicitly
  specs:
    - Write requirements that can be verified without starting Streamlit
  tasks:
    - Break tasks into chunks of max 1 hour
    - Each task that adds a class also adds its unit test file
    - Never include a git operation in a task; the user performs those

operations:
  apply:
    guidance:
      - Keep the summaries concise
      - Verify function, class and layering limits before marking a task done
  archive:
    guidance:
      - Summarize the archive outcome before finishing
